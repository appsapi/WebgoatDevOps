name: Canal Abisal - prueba (sin publicar)

# Comprueba claves y genera un Short completo SIN subirlo a YouTube.
on:
  push:
    branches: ["claude/**"]
    paths: ["youtube-profundidades/**", ".github/workflows/canal-profundidades*.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canal-abisal-prueba
  cancel-in-progress: true

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: youtube-profundidades
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: youtube-profundidades/requirements.txt

      - name: Instalar ffmpeg y fuentes
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Diagnóstico de claves y servicios
        run: python tools/check_setup.py

      - name: Generar un Short de prueba (sin subir)
        run: python run.py --format short --no-upload

      - name: Guardar resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abisal-prueba-${{ github.run_id }}
          path: |
            youtube-profundidades/output/*/*.mp4
            youtube-profundidades/output/*/*.json
            youtube-profundidades/output/*/*.md
            youtube-profundidades/output/*/*.txt
          retention-days: 7
          if-no-files-found: ignore
